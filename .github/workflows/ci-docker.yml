name: CI - Build & Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- Next.js app ----
      - name: Install deps (Next.js)
        working-directory: next15-micro-k8s/next-app
        run: npm install

      - name: Build (Next.js)
        working-directory: next15-micro-k8s/next-app
        run: npm run build

      # ---- Contact microservice ----
      - name: Install deps (contact-service)
        working-directory: next15-micro-k8s/contact-service
        run: npm install

  docker-build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      FRONTEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/next15-frontend
      API_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/contact-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./next15-micro-k8s/next-app
          file: ./next15-micro-k8s/next-app/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./next15-micro-k8s/contact-service
          file: ./next15-micro-k8s/contact-service/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
