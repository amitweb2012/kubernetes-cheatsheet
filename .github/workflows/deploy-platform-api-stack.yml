name: Deploy Platform API Stack

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud provider
        required: true
        type: choice
        options:
          - aws
          - azure
      cluster_name:
        description: Kubernetes cluster name
        required: true
        type: string
      namespace:
        description: Kubernetes namespace
        required: true
        default: platform
        type: string
      aws_region:
        description: AWS region (AWS only)
        required: false
        type: string
      azure_resource_group:
        description: Azure resource group (Azure only)
        required: false
        type: string
      azure_subscription_id:
        description: Azure subscription ID (Azure only; leave blank to use secret)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-api-stack-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.cloud }} Kubernetes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      NAMESPACE: ${{ inputs.namespace }}
      CHART_DIR: projects/platform-api-stack/helm/platform-api-stack
      IMAGE_TAG: sha-${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@v4

      - name: Validate required inputs and image namespace
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${NAMESPACE}" ]] || { echo "Namespace is required"; exit 1; }
          [[ "${NAMESPACE}" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]] || { echo "Invalid Kubernetes namespace"; exit 1; }
          [[ -n "${DOCKERHUB_USERNAME}" ]] || { echo "Set DOCKERHUB_USERNAME repository secret"; exit 1; }
          if [[ "${{ inputs.cloud }}" == "aws" ]]; then
            [[ -n "${{ inputs.aws_region }}" ]] || { echo "aws_region is required for AWS"; exit 1; }
            [[ -n "${{ secrets.AWS_ROLE_ARN }}" ]] || { echo "Set AWS_ROLE_ARN secret"; exit 1; }
          else
            [[ -n "${{ inputs.azure_resource_group }}" ]] || { echo "azure_resource_group is required for Azure"; exit 1; }
            [[ -n "${{ secrets.AZURE_CLIENT_ID }}" && -n "${{ secrets.AZURE_TENANT_ID }}" ]] || { echo "Set AZURE_CLIENT_ID and AZURE_TENANT_ID secrets"; exit 1; }
            [[ -n "${{ inputs.azure_subscription_id || secrets.AZURE_SUBSCRIPTION_ID }}" ]] || { echo "Set Azure subscription ID input or AZURE_SUBSCRIPTION_ID secret"; exit 1; }
          fi

      - name: Configure AWS credentials (EKS)
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Configure kubectl for EKS
        if: inputs.cloud == 'aws'
        shell: bash
        run: aws eks update-kubeconfig --name "${{ inputs.cluster_name }}" --region "${{ inputs.aws_region }}"

      - name: Azure login (AKS)
        if: inputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure_subscription_id || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure kubectl for AKS
        if: inputs.cloud == 'azure'
        shell: bash
        run: |
          az aks get-credentials \
            --resource-group "${{ inputs.azure_resource_group }}" \
            --name "${{ inputs.cluster_name }}" \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Verify cluster access
        run: |
          kubectl cluster-info
          kubectl get namespace "${NAMESPACE}" >/dev/null

      - name: Run database migrations before application rollout
        shell: bash
        run: |
          set -euo pipefail
          JOB="platform-api-migrate-${GITHUB_RUN_ID}"
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/platform-api:${IMAGE_TAG}"
          kubectl create job "${JOB}" \
            --namespace "${NAMESPACE}" \
            --image="${IMAGE}" \
            -- node src/db/migrate.js
          kubectl set env "job/${JOB}" --namespace "${NAMESPACE}" --from="secret/platform-api-secrets"
          kubectl wait --for=condition=complete "job/${JOB}" \
            --namespace "${NAMESPACE}" --timeout=5m
          kubectl logs "job/${JOB}" --namespace "${NAMESPACE}"

      - name: Deploy application with Helm
        shell: bash
        run: |
          set -euo pipefail
          helm upgrade --install platform-api-stack "${CHART_DIR}" \
            --namespace "${NAMESPACE}" \
            --set-string api.image.repository="docker.io/${DOCKERHUB_USERNAME}/platform-api" \
            --set-string api.image.tag="${IMAGE_TAG}" \
            --set-string web.image.repository="docker.io/${DOCKERHUB_USERNAME}/platform-web" \
            --set-string web.image.tag="${IMAGE_TAG}" \
            --wait --atomic --timeout 10m

      - name: Verify deployment
        run: |
          kubectl get deployments,pods,services,ingress -n "${NAMESPACE}"
          kubectl rollout status deployment/platform-api-stack-api -n "${NAMESPACE}" --timeout=5m
          kubectl rollout status deployment/platform-api-stack-web -n "${NAMESPACE}" --timeout=5m
