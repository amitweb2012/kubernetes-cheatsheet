
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: kubernetes-dashboard

# This YAML file creates a ServiceAccount named "admin-user" in the "kubernetes-dashboard" namespace.
# It also creates a ClusterRoleBinding that binds the "admin-user" ServiceAccount to the "cluster-admin" ClusterRole.
# This setup grants the "admin-user" ServiceAccount full administrative privileges across the entire Kubernetes cluster.
# This configuration is typically used to provide elevated access to the Kubernetes Dashboard for administrative tasks.

