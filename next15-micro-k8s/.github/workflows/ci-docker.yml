name: CI - Build & Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.io
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/next15-frontend
      API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/contact-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Next.js)
        run: |
          cd next-app
          npm install
          npm run build

      - name: Install dependencies (contact-service)
        run: |
          cd contact-service
          npm install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./next-app
          file: ./next-app/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./contact-service
          file: ./contact-service/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
