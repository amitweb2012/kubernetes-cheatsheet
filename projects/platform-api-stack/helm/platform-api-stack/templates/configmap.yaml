apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-api-stack.fullname" . }}-config
  labels:
    {{- include "platform-api-stack.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.api.port | quote }}
  REDIS_URL: "redis://{{ include "platform-api-stack.fullname" . }}-redis:{{ .Values.redis.port }}"
