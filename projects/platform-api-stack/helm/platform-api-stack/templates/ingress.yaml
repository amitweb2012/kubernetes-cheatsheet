{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform-api-stack.fullname" . }}-api
  labels:
    {{- include "platform-api-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  rules:
    - host: {{ .Values.api.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-api-stack.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
{{- end }}
{{- if .Values.web.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform-api-stack.fullname" . }}-web
  labels:
    {{- include "platform-api-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.web.ingress.className }}
  rules:
    - host: {{ .Values.web.ingress.host | quote }}
      http:
        paths:
          # Next.js handles OAuth callbacks and proxies authenticated API requests.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-api-stack.fullname" . }}-web
                port:
                  number: {{ .Values.web.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform-api-stack.fullname" . }}-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
