apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-api-stack.fullname" . }}-web
  labels:
    {{- include "platform-api-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
