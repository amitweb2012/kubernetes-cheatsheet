nameOverride: ""
fullnameOverride: ""

api:
  replicaCount: 2
  image:
    repository: platform-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 3000
  ingress:
    enabled: true
    className: nginx
    host: api.platform.local
  existingSecret: platform-api-secrets
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

web:
  replicaCount: 2
  image:
    repository: platform-web
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 3000
  ingress:
    enabled: true
    className: nginx
    host: app.platform.local
  existingSecret: platform-web-secrets
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

redis:
  image: redis:7.4-alpine
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

postgresql:
  image: postgres:16-alpine
  port: 5432
  storage: 2Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  enabled: true
  ingressNamespaceLabel: kubernetes.io/metadata.name
  ingressNamespaceValue: ingress-nginx
